function sceneInit(){$('fx').insertAdjacentHTML('afterbegin',SCENE)}
function scan(src){
  let o='',E=[],st=0,q='';const ln=()=>o.split('\n').length;
  const un=()=>({line:ln(),msg:'Unterminated '+(q==='"'?'string':'character')+' literal (missing closing '+q+')'});
  for(let i=0;i<src.length;i++){const c=src[i],d=src[i+1];
    if(st===0){
      if(c==='/'&&d==='/'){st=1;o+='  ';i++}
      else if(c==='/'&&d==='*'){st=2;o+='  ';i++}
      else{if(c==='"'||c==="'"){st=3;q=c}o+=c}
    }else if(st===1){o+=c==='\n'?c:' ';if(c==='\n')st=0}
    else if(st===2){if(c==='*'&&d==='/'){st=0;o+='  ';i++}else o+=c==='\n'?c:' '}
    else{
      if(c==='\\'){o+=d==='\n'?' \n':'  ';i++}
      else if(c===q){st=0;o+=c}
      else if(c==='\n'){st=0;E.push(un());o+=c}
      else o+=' '}
  }
  if(st===3)E.push(un());
  return{t:o,E}
}
function lint(lang,src){
  const {t,E}=scan(src),L=t.split('\n'),add=(line,msg)=>E.push({line,msg});
  const stk=[],pr={')':'(',']':'[','}':'{'};let ln=1;
  for(const c of t){
    if(c==='\n')ln++;
    else if('([{'.includes(c))stk.push({c,ln});
    else if(pr[c]){const o=stk.pop();
      if(!o)add(ln,`Unexpected '${c}' with no matching '${pr[c]}'`);
      else if(o.c!==pr[c])add(ln,`'${c}' does not match the '${o.c}' opened on line ${o.ln}`)}
  }
  stk.forEach(o=>add(o.ln,`'${o.c}' is never closed`));
  const first=re=>L.findIndex(l=>re.test(l))+1;
  if(lang==='c'){const w=first(/\b(cout|cin|Scanner)\b|System\.out/);if(w)add(w,'This looks like C++/Java, but C is selected. Use printf and scanf.');
    const u=first(/\b(printf|scanf|puts)\s*\(/);if(u&&!/#\s*include\s*<stdio\.h>/.test(t))add(u,'printf/scanf used without #include <stdio.h>')}
  else if(lang==='cpp'){const w=first(/System\.out|\bScanner\b/);if(w)add(w,'This looks like Java, but C++ is selected. Use cout and cin.');
    const u=first(/\b(cout|cin)\b/);if(u){if(!/#\s*include\s*<iostream>/.test(t))add(u,'cout/cin used without #include <iostream>');
      else if(!/using\s+namespace\s+std/.test(t)&&!/std::(cout|cin)/.test(t))add(u,'cout/cin not declared: add using namespace std; or write std::cout')}}
  else{const w=first(/^\s*#\s*include|using\s+namespace|\b(cout|cin)\b|(^|[^.\w])(printf|scanf)\s*\(/);if(w)add(w,'This looks like C/C++, but Java is selected. Use System.out.println and Scanner.');
    const u=first(/\bScanner\b/);if(u&&!/java\.util\.(\*|Scanner)/.test(t))add(u,'Scanner used without import java.util.*;')}
  L.forEach((l,i)=>{if(/^\s*case\b/.test(l)&&!/:|->/.test(l))add(i+1,"A case label needs a ':' after the value")});
  const ST=/^\s*(printf|scanf|puts|cout|cin|System\.out\.\w+|return|break|continue|int|float|double|char|long|String|Scanner)\b/;
  L.forEach((l,i)=>{
    const s=l.trim();if(!s||s[0]==='#'||!ST.test(s))return;
    if(/[;{}:,(]$|<<$|>>$|[+\-*\/=&|]$/.test(s))return;
    if((s.match(/\(/g)||[]).length!==(s.match(/\)/g)||[]).length)return;
    if(/^(int|float|double|char|long|String)\b/.test(s)&&/\(/.test(s)&&!/=/.test(s))return;
    const nx=(L.slice(i+1).find(x=>x.trim())||'').trim();
    if(/^(<<|>>|\+|\.|,|\)|&&|\|\||\?|:)/.test(nx))return;
    add(i+1,"Missing ';' at the end of this statement");
  });
  let cur=null,dp=0;
  L.forEach((l,i)=>{
    const net=(l.match(/\{/g)||[]).length-(l.match(/\}/g)||[]).length;
    if(/^\s*case\b[^:]*->/.test(l)){cur=null;dp+=net;return}
    const m=l.match(/^\s*(?:case\b[^:]*|default\s*):(.*)$/);
    if(m){
      if(cur&&cur.body&&!cur.end)add(cur.line,'This case has no break, so it falls through into the next case');
      const r=m[1];cur={line:i+1,d:dp,body:false,end:false};
      if(/\S/.test(r)&&!/^\s*\{?\s*$/.test(r)&&!/^\s*(case\b|default\b)/.test(r))cur.body=true;
      if(/\b(break|return|continue|exit)\b/.test(r))cur.end=true;
    }else if(cur){
      if(/\b(break|return|continue|exit)\b/.test(l))cur.end=true;
      if(/\S/.test(l)&&!/^\s*[{}]\s*$/.test(l))cur.body=true;
    }
    dp+=net;if(cur&&dp<cur.d)cur=null;
  });
  const seen=new Set();
  return E.filter(e=>{const k=e.line+e.msg;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.line-b.line).slice(0,6)
}
function gut(bad){const t=$('code');if(!t)return;$('gut').innerHTML=t.value.split('\n').map((_,i)=>`<span class='${(bad||[]).includes(i+1)?'e':''}'>${i+1}</span>`).join('');$('gut').scrollTop=t.scrollTop}
function jump(ln){const t=$('code'),L=t.value.split('\n');let s=0;for(let i=0;i<ln-1;i++)s+=L[i].length+1;t.focus();t.setSelectionRange(s,s+(L[ln-1]||'').length);t.scrollTop=Math.max(0,(ln-4)*21)}
function submit(){
  const code=$('code').value;S.code[S.lang]=code;
  const errs=lint(S.lang,code),g=grade(QS[S.q],S.lang,code),raw=code.split('\n');
  gut(errs.map(e=>e.line));
  if(!errs.length&&g.pass===g.total){S.solved=true;play();return}
  $('fb').innerHTML=errs.length?`<div class='bad'>✗ ${errs.length} error${errs.length>1?'s':''} found. Tap an error to jump to its line, fix it, then submit again.</div>`+errs.map(e=>`<button class='err' data-ln='${e.line}'><b>Line ${e.line}:</b> ${esc(e.msg)}<code>${esc((raw[e.line-1]||'').trim())}</code></button>`).join(''):`<span class='bad'>✗ No syntax errors, but the solution isn’t correct yet.</span> <span class='note'>${g.pass} of ${g.total} checks passed.</span>`;
  const p=$('pane');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');
}
document.addEventListener('input',e=>{if(e.target.id==='code')gut()});
document.addEventListener('scroll',e=>{if(e.target.id==='code')$('gut').scrollTop=e.target.scrollTop},true);
let S=null;
function pick(){ // new random question every session, never the same one twice in a row
  let last=-1;try{last=+localStorage.getItem("sauce-last")}catch(e){}
  let i;do{i=Math.random()*QS.length|0}while(i===last&&QS.length>1);
  try{localStorage.setItem("sauce-last",i)}catch(e){}
  return i;
}
let pendingLang="c";
function home(){
  S=null;$("who").innerHTML="";
  $("main").innerHTML=`<div class="card narrow"><div class="hero">${hat(92)}${potion(60)}</div><h1>Welcome, <span class="brand"><b>Sauce Chef</b></span></h1>
  <p class="muted">Solve a random switch-case trial to earn the sauce ingredient. Pick your language to begin.</p>
  
  <div class="langs">${Object.keys(LANGS).map(k=>`<button class="lang ${k===pendingLang?"on":""}" data-l="${k}">${LANGS[k]}</button>`).join("")}</div>
  <button class="go full" id="start">Get my question</button></div>`;
}
function start(){
  S={q:pick(),lang:pendingLang,code:{c:STARTER.c,cpp:STARTER.cpp,java:STARTER.java},solved:false};
  play();
}
function play(){
  const Q=QS[S.q];
  $("who").innerHTML=`<button class="ghost" id="newsess">New session</button>`;
  if(S.solved){
    $("main").innerHTML=`<div class="card narrow win-card"><div class="hero">${potion(104)}</div><div class="inv">Ingredient in your inventory</div><p class="muted">Sauce ingredient collected. Ready for another random trial?</p><button class="go full" id="newsess2">Start new session</button></div>`;
    return;
  }
  $("main").innerHTML=`<div class="split"><div class="card"><div class="pot-s">${potion(42)}</div><h2>${Q.e} ${Q.t}</h2><p class="muted">${Q.s}</p>
  <div class="box"><b>Problem:</b> ${Q.task}</div>
  <div class="tw"><table><tr>${Q.head.map(h=>`<th>${h}</th>`).join("")}</tr>${Q.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>
  ${Q.html?`<div class="box">${Q.html}</div>`:""}<div class="box warn"><b>Constraint:</b> ${Q.con}</div></div>
  <div class="card" id="pane"><div class="langs" style="justify-content:flex-start;margin-top:0">${Object.keys(LANGS).map(k=>`<button class="lang ${k===S.lang?"on":""}" data-t="${k}">${LANGS[k]}</button>`).join("")}</div>
  <div class="win"><pre id="gut" aria-hidden="true"></pre><textarea id="code" wrap="off" spellcheck="false" aria-label="Code editor"></textarea></div>
  <div style="margin-top:12px"><button class="go" id="check">Submit code</button></div><div id="fb" aria-live="polite"></div></div></div>`;
  $("code").value=S.code[S.lang];gut();
}
function check(){
  S.code[S.lang]=$("code").value;
  const g=grade(QS[S.q],S.lang,S.code[S.lang]);
  if(g.pass===g.total){S.solved=true;play();return}
  $("fb").innerHTML=`<span class="bad">✗ Not correct yet.</span> <span class="note">${g.pass} of ${g.total} checks passed. Fix your code and submit again.</span>`;
  const p=$("pane");p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.l){pendingLang=b.dataset.l;home()}
  if(b.dataset.t&&S){S.code[S.lang]=$("code").value;S.lang=b.dataset.t;play()}
  if(b.id==="start")start();
  if(b.id==="check")submit();
  if(b.dataset.ln&&S)jump(+b.dataset.ln);
  if(b.id==="newsess"||b.id==="newsess2")home();
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="code"&&e.key==="Tab"){e.preventDefault();e.target.setRangeText("    ",e.target.selectionStart,e.target.selectionEnd,"end")}
});
fxInit();sceneInit();home();
