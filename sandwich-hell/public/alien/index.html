<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cosmic Vegetables · The Legendary Sandwich From Hell</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/chapter-hud.css">
<style>
:root{--night:#120f26;--moon:#f7e9b0;--peach:#f0c89a;--ghost:#b9a7e8;--stone:#4a4570;--stone2:#2c2846;--bone:#ece6d2;--acid:#7dff6a;--blood:#b3262e;--err:#ff8d92;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 10%,#262358 0,var(--night) 65%,#07050f 100%) fixed;color:var(--bone);font-family:'VT323',monospace;font-size:22px;line-height:1.25;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);z-index:50}
h1,h2,h3{font-family:'Press Start 2P',monospace;font-weight:400}
svg{display:block}
#sky{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#moon{position:absolute;top:3vh;left:50%;width:min(70vw,360px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 28% 24%,#fff6cf,var(--moon) 50%,var(--peach));box-shadow:0 0 90px 24px rgba(247,233,176,.2),inset -18px -14px 0 rgba(200,150,110,.35);opacity:.5}
.st{position:absolute;width:4px;height:4px;background:#fff;opacity:.6;animation:tw 3s steps(2) infinite}
@keyframes tw{50%{opacity:.1}}
.fly{position:absolute;left:-90px;fill:#07050f;animation:cross linear infinite}
.fly svg{animation:flap .45s steps(2) infinite}
@keyframes cross{to{transform:translateX(calc(100vw + 180px))}}
@keyframes flap{50%{transform:scaleY(.55)}}
#witch{position:absolute;top:16vh;left:-140px;width:110px;fill:#04030a;animation:cross 40s linear infinite 5s}
.gh{position:absolute;width:52px;opacity:.7;animation:drift 11s steps(22) infinite alternate}
.gh .b{fill:#f4efff}.gh .e{fill:#120f26}.gh.lo .b{fill:var(--ghost)}
@keyframes drift{to{transform:translate(40px,-34px)}}
#fog{position:fixed;left:0;right:0;bottom:0;height:30vh;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(80,70,130,.45),transparent)}
#graves{position:fixed;left:0;right:0;bottom:0;height:80px;z-index:1;pointer-events:none;display:flex;align-items:flex-end;justify-content:space-around;opacity:.7}
.gv{width:46px;background:var(--stone);border:4px solid #1c1836;border-bottom:0;border-radius:18px 18px 0 0;position:relative}
.gv::before{content:"";position:absolute;left:50%;top:-28px;width:8px;height:28px;background:var(--stone);transform:translateX(-50%);box-shadow:-8px 8px 0 var(--stone),8px 8px 0 var(--stone)}
main{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:16px 14px 120px}
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:clamp(14px,3.2vw,24px);line-height:1.6;margin:0;text-shadow:3px 3px 0 #07050f,0 0 22px rgba(247,233,176,.35)}
.sb{color:var(--ghost);font-size:21px;margin:4px 0 0}
.btn{font-family:'Press Start 2P',monospace;font-size:11px;background:var(--stone2);color:var(--bone);border:4px solid var(--bone);padding:12px 14px;cursor:pointer;box-shadow:5px 5px 0 #07050f}
.btn:hover:not(:disabled){background:var(--blood)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 #07050f}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{font-size:9px;padding:9px 10px}
.btn:focus-visible,textarea:focus-visible,input:focus-visible,.qi:focus-visible{outline:3px solid var(--acid);outline-offset:2px}
.panel{background:linear-gradient(180deg,rgba(50,45,88,.96),rgba(37,33,63,.96));border:4px solid #6a6396;border-top-color:#8f88bd;box-shadow:6px 6px 0 #07050f;padding:14px 16px;margin-bottom:16px}
.panel h3{font-size:10px;margin:0 0 10px;color:var(--ghost);line-height:1.6}
#inv{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#inv .cnt{font-family:'Press Start 2P';font-size:10px;color:var(--peach);margin-right:6px}
.slot{width:26px;height:30px;background:var(--stone2);border:3px solid var(--stone);border-radius:10px 10px 0 0;display:grid;place-items:center;color:#4a4570}
.slot svg{width:16px}
.slot.on{border-color:var(--acid);color:var(--acid);box-shadow:0 0 10px rgba(125,255,106,.5)}
.slot.on svg{filter:drop-shadow(0 0 4px var(--acid))}
.lay{display:block;max-width:860px;margin:0 auto}
#list{padding:12px;max-height:80vh;overflow:auto}
.qi{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--stone2);border:3px solid var(--stone);color:var(--bone);font-family:'VT323',monospace;font-size:20px;padding:6px 8px;margin-bottom:6px;cursor:pointer}
.qi.cur{border-color:var(--moon);background:#3a3568}
.qi.done{border-color:var(--acid);color:var(--acid)}
.qi b{font-family:'Press Start 2P';font-size:9px;font-weight:400;color:var(--peach);min-width:22px}
.qi.done b{color:var(--acid)}
#q h2{font-size:clamp(11px,2.6vw,15px);line-height:1.7;margin:0 0 10px;color:var(--peach)}
#q p{margin:0 0 8px;font-size:23px}
#q .k{color:var(--ghost)}
pre{margin:0;font-family:'VT323',monospace;white-space:pre}
#q pre{background:#0b0918;border:3px solid #1c1836;padding:8px 10px;margin:0 0 8px;font-size:22px;color:#d8d2f0;overflow-x:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.lg{font-family:'Press Start 2P';font-size:10px;padding:10px 14px;background:var(--stone2);border:3px solid var(--stone);color:#9a92c4;cursor:pointer}
.lg.on{border-color:var(--moon);color:var(--moon);background:#3a3568}
#ed{position:relative;display:flex;height:350px;background:#0b0918;border:3px solid #1c1836;font:20px/24px 'VT323',monospace}
#gut{width:46px;overflow:hidden;background:#15112d;color:#6a6396;text-align:right;padding:8px 6px 0 0;flex:none}
#gut div{height:24px}
#gut .er{background:var(--blood);color:#fff}
#hl{position:absolute;left:46px;right:0;height:24px;background:rgba(179,38,46,.4);display:none;pointer-events:none}
#ta{flex:1;min-width:0;padding:8px 10px;line-height:24px;font:inherit;background:transparent;color:#e4dcff;border:0;resize:none;white-space:pre;overflow:auto;tab-size:4;caret-color:var(--acid)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row label{color:var(--ghost);font-size:20px}
#ci{flex:1;min-width:140px;font-family:'VT323',monospace;font-size:21px;background:#0b0918;color:var(--acid);border:3px solid #1c1836;padding:6px 8px}
#con{min-height:90px}
#con pre{background:#0b0918;border:3px solid #1c1836;padding:8px 10px;margin:8px 0;font-size:21px;color:#d8d2f0;overflow-x:auto}
.eh{font-family:'Press Start 2P';font-size:10px;color:var(--err);line-height:1.7}
.em{color:var(--err);font-size:23px;margin:6px 0}
.el b{color:var(--err);font-weight:400}
.pass{color:var(--acid)}.fail{color:var(--err)}
.ok{display:flex;gap:12px;align-items:center;border:4px solid var(--acid);padding:12px 14px;background:rgba(125,255,106,.08);box-shadow:0 0 24px rgba(125,255,106,.3);animation:pop .8s steps(6)}
.ok svg{width:38px;color:var(--acid);filter:drop-shadow(0 0 8px var(--acid));flex:none}
.ok span{font-family:'Press Start 2P';font-size:clamp(10px,2.6vw,14px);line-height:1.7;color:var(--acid)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.dim{color:#8f86b8;font-size:20px}
@media (max-width:860px){.lay{grid-template-columns:1fr}#list{max-height:none;display:flex;gap:6px;overflow-x:auto}.qi{width:auto;flex:none;margin:0;white-space:nowrap}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}.fly,#witch{display:none}}
</style>

<main>
<div class="hd">
  <div>
    <h1>Space Level:<br>Cosmic Vegetables</h1>
    <p class="sb">Solve 6 coding questions to collect the Cosmic Vegetables for the sandwich.</p>
  </div>

</div></div>

</section></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
for(let i=0;i<36;i++){const s=document.createElement('i');s.className='st';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*70}%;animation-delay:${Math.random()*3}s`;$('#stars').appendChild(s)}
for(let i=0;i<8;i++){const g=document.createElement('i');g.className='gv';g.style.height=(30+Math.random()*40)+'px';$('#graves').appendChild(g)}

/* ===== mini C / C++ / Java interpreter (subset) ===== */
const TY=new Set(['int','long','short','double','float','char','bool','boolean','unsigned','signed','String','const','final','static','Scanner']);
function tokenize(src){const T=[];let i=0,l=1;const n=src.length;
 const ops=['<<=','>>=','&&','||','==','!=','<=','>=','++','--','+=','-=','*=','/=','%=','<<','>>','::'];
 while(i<n){const c=src[i];
  if(c=='\n'){l++;i++;continue}
  if(/\s/.test(c)){i++;continue}
  if(c=='/'&&src[i+1]=='/'){while(i<n&&src[i]!='\n')i++;continue}
  if(c=='/'&&src[i+1]=='*'){i+=2;while(i<n&&!(src[i]=='*'&&src[i+1]=='/')){if(src[i]=='\n')l++;i++}i+=2;continue}
  if(c=='#'){while(i<n&&src[i]!='\n')i++;continue}
  if(/[A-Za-z_]/.test(c)){let j=i;while(j<n&&/\w/.test(src[j]))j++;T.push({t:'id',v:src.slice(i,j),l});i=j;continue}
  if(/\d/.test(c)){let j=i;while(j<n&&/[\d.]/.test(src[j]))j++;const v=+src.slice(i,j);while(/[lLuUfF]/.test(src[j]||''))j++;T.push({t:'num',v,l});i=j;continue}
  if(c=='"'){let j=i+1,s='';while(j<n&&src[j]!='"'){if(src[j]=='\n')throw{l,m:'missing terminating " character'};if(src[j]=='\\'){const e=src[j+1];s+=e=='n'?'\n':e=='t'?'\t':e;j+=2}else s+=src[j++]}
   if(j>=n)throw{l,m:'missing terminating " character'};T.push({t:'str',v:s,l});i=j+1;continue}
  if(c=="'"){let j=i+1,ch;if(src[j]=='\\'){const e=src[j+1];ch=e=='n'?10:e=='t'?9:e=='0'?0:e.charCodeAt(0);j+=2}else ch=src.charCodeAt(j++);
   if(src[j]!="'")throw{l,m:'missing terminating \' character'};T.push({t:'num',v:ch,ch:1,l});i=j+1;continue}
  const o=ops.find(x=>src.startsWith(x,i));if(o){T.push({t:'op',v:o,l});i+=o.length;continue}
  T.push({t:'op',v:c,l});i++}
 const R=[];for(let k=0;k<T.length;k++){if(T[k].v=='std'&&T[k+1]&&T[k+1].v=='::'&&T[k+2]){T[k+2].std=1;k++;continue}R.push(T[k])}
 return R}

function parse(T,lang,src){
 let p=0;const last=T.length?T[T.length-1].l:1;
 const peek=(k=0)=>T[p+k]||{t:'eof',v:'end of file',l:last};
 const prevL=()=>(T[p-1]||{l:1}).l;
 const isOp=v=>peek().t=='op'&&peek().v==v;
 const eat=v=>isOp(v)?(p++,true):false;
 const need=v=>{if(!eat(v))throw{l:(v==';'||v==')')?prevL():peek().l,m:`expected '${v}' before '${peek().v}'`}};
 const hasUsing=/using\s+namespace\s+std\s*;/.test(src);
 // brace balance
 const st=[];for(const t of T){if(t.t!='op')continue;if(t.v=='{')st.push(t);else if(t.v=='}'){if(!st.length)throw{l:t.l,m:"unexpected '}' (extra closing brace)"};st.pop()}}
 if(st.length)throw{l:last,m:`expected '}' at end of input (the '{' on line ${st[st.length-1].l} is never closed)`};
 if(lang=='java'&&!T.some(t=>t.v=='class'))throw{l:1,m:'class, interface, or enum expected: wrap your code in a class'};
 const BIN=[['||'],['&&'],['==','!='],['<','>','<=','>='],['+','-'],['*','/','%']];
 function expr(){return assign()}
 function assign(){const l=cond(),t=peek();
  if(t.t=='op'&&['=','+=','-=','*=','/=','%='].includes(t.v)){if(l.k!='var')throw{l:t.l,m:'lvalue required as left operand of assignment'};p++;return{k:'asg',op:t.v,name:l.name,r:assign(),l:t.l}}
  return l}
 function cond(){const c=bin(0);if(eat('?')){const a=assign();need(':');return{k:'tern',c,a,b:assign()}}return c}
 function bin(lv){if(lv==BIN.length)return unary();let l=bin(lv+1);
  while(peek().t=='op'&&BIN[lv].includes(peek().v)){const o=peek();p++;l={k:'bin',op:o.v,l,r:bin(lv+1),ln:o.l}}return l}
 function unary(){const t=peek();
  if(t.t=='op'){
   if(t.v=='!'||t.v=='-'||t.v=='+'){p++;return{k:'un',op:t.v,e:unary(),l:t.l}}
   if(t.v=='++'||t.v=='--'){p++;const v=peek();if(v.t!='id')throw{l:v.l,m:`expected identifier before '${v.v}'`};p++;return{k:'inc',name:v.v,d:t.v=='++'?1:-1,pre:1,l:t.l}}
   if(t.v=='&'){p++;const v=peek();p++;return{k:'addr',name:v.v,l:t.l}}
   if(t.v=='('&&peek(1).t=='id'&&TY.has(peek(1).v)){let q=1;while(peek(q).t=='id'&&TY.has(peek(q).v))q++;if(peek(q).v==')'){const dbl=/double|float/.test(peek(1).v);p+=q+1;return{k:'cast',d:dbl,e:unary(),l:t.l}}}}
  return post()}
 function post(){const e=prim(),t=peek();
  if(t.t=='op'&&(t.v=='++'||t.v=='--')&&e.k=='var'){p++;return{k:'inc',name:e.name,d:t.v=='++'?1:-1,l:t.l}}return e}
 function prim(){const t=peek();
  if(t.t=='num'){p++;return{k:'num',v:t.v,ch:t.ch,l:t.l}}
  if(t.t=='str'){p++;return{k:'str',v:t.v,l:t.l}}
  if(t.t=='op'&&t.v=='('){p++;const e=expr();need(')');return e}
  if(t.t=='id'){p++;
   if(t.v=='true'||t.v=='false')return{k:'num',v:t.v=='true'?1:0,l:t.l};
   if(t.v=='new'){p++;need('(');if(!isOp(')'))do{assign()}while(eat(','));need(')');return{k:'num',v:0,l:t.l}}
   let nm=t.v;while(isOp('.')&&peek(1).t=='id'){p++;nm+='.'+peek().v;p++}
   if(isOp('(')){p++;const a=[];if(!isOp(')'))do{a.push(assign())}while(eat(','));need(')');return{k:'call',name:nm,args:a,l:t.l}}
   return{k:'var',name:nm,l:t.l,std:t.std}}
  throw{l:t.t=='eof'?last:t.l,m:`expected expression before '${t.v}'`}}
 function decl(noSemi){const l=peek().l;let ty='';while(peek().t=='id'&&TY.has(peek().v)){ty+=peek().v+' ';p++}
  const base=/double|float/.test(ty)?'double':/long/.test(ty)?'long':/char/.test(ty)?'char':/bool/.test(ty)?'bool':/String/.test(ty)?'String':/Scanner/.test(ty)?'sc':'int';
  const d=[];do{const n=peek();if(n.t!='id')throw{l:n.l,m:`expected identifier before '${n.v}'`};p++;
   if(isOp('['))throw{l:n.l,m:'arrays are not supported by this checker'};
   let e=null;if(eat('='))e=assign();d.push({n:n.v,e})}while(eat(','));
  if(!noSemi)need(';');return{k:'decl',ty:base,d,l}}
 function block(){const l=peek().l;need('{');const b=[];
  while(!isOp('}')){if(peek().t=='eof')throw{l:last,m:"expected '}' at end of input"};b.push(stmt())}
  need('}');return{k:'blk',b,l}}
 function stmt(){const t=peek();
  if(isOp('{'))return block();
  if(isOp(';')){p++;return{k:'nop',l:t.l}}
  if(t.t=='id'){
   switch(t.v){
    case'if':{p++;need('(');const c=expr();need(')');const a=stmt();let b=null;if(peek().v=='else'){p++;b=stmt()}return{k:'if',c,a,b,l:t.l}}
    case'while':{p++;need('(');const c=expr();need(')');return{k:'while',c,s:stmt(),l:t.l}}
    case'do':{p++;const s=stmt();if(peek().v!='while')throw{l:peek().l,m:"expected 'while' after do body"};p++;need('(');const c=expr();need(')');need(';');return{k:'do',c,s,l:t.l}}
    case'for':{p++;need('(');let i=null,c=null,u=null;
     if(!isOp(';')){if(peek().t=='id'&&TY.has(peek().v))i=decl(1);else i={k:'ex',e:expr(),l:t.l}}need(';');
     if(!isOp(';'))c=expr();need(';');
     if(!isOp(')'))u=expr();need(')');return{k:'for',i,c,u,s:stmt(),l:t.l}}
    case'break':p++;need(';');return{k:'brk',l:t.l};
    case'continue':p++;need(';');return{k:'cnt',l:t.l};
    case'return':{p++;if(!isOp(';'))expr();need(';');return{k:'ret',l:t.l}}
    case'cout':case'cin':{
     if(lang!='cpp')throw{l:t.l,m:lang=='java'?`cannot find symbol: variable ${t.v}`:`'${t.v}' undeclared (first use in this function); ${t.v} is C++. In C use ${t.v=='cout'?'printf':'scanf'}`};
     if(!hasUsing&&!t.std)throw{l:t.l,m:`'${t.v}' was not declared in this scope; add 'using namespace std;' or write std::${t.v}`};

    c.innerHTML='<h3>Console</h3><div class="ok"><svg viewBox="0 0 12 12"><use href="#sp"/></svg><span>Cosmic Vegetables collected! ('+solved.size+'/'+REQUIRED_SOLVES+' Complete)</span></div>';
    try { c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch(e){}
  }
  if(window.Room) Room.complete('alien');
};
</script>
