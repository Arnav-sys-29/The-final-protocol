<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- GBA Pokemon Trainer Back-Sprite: The Legendary Chef -->
  <defs>
    <radialGradient id="auraChef" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground Shadow on Battle Platform -->
  <ellipse cx="80" cy="148" rx="42" ry="10" fill="#0c0714" opacity="0.7" />

  <!-- Chef Coat / Shoulders (Back View) -->
  <!-- Dark Obsidian / Chef White Double-Breasted Uniform -->
  <path d="M40,140 C40,115 50,95 80,95 C110,95 120,115 120,140 Z" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <!-- Chef Red/Gold Scarf / Apron Ties -->
  <path d="M68,98 Q80,108 92,98 Q86,122 80,135 Q74,122 68,98 Z" fill="#e11d48" stroke="#be123c" stroke-width="2" />
  <circle cx="80" cy="104" r="3.5" fill="#f59e0b" />

  <!-- Head (Back of Hair) -->
  <ellipse cx="80" cy="74" rx="22" ry="20" fill="#1e1b4b" stroke="#0f172a" stroke-width="2" />

  <!-- Puffy Tall Chef Hat (Toque Blanche) -->
  <path d="M60,65 C55,42 62,28 74,25 C80,24 86,25 90,28 C102,28 108,44 100,65 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
  <!-- Hat Creases / Pleats -->
  <path d="M68,58 C68,45 72,36 74,30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M80,56 C80,42 81,34 82,28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M92,58 C92,45 90,36 88,30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Hat Band -->
  <rect x="62" y="62" width="36" height="8" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />

  <!-- Spatula / Compiler Wand in Right Hand (Ready to strike) -->
  <g transform="translate(112, 85) rotate(-35)">
    <rect x="0" y="0" width="6" height="44" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    <path d="M-6,-16 L12,-16 L10,0 L-4,0 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
    <!-- Glowing spatula runes -->
    <line x1="-1" y1="-12" x2="7" y2="-12" stroke="#fff" stroke-width="1.5" />
    <line x1="-1" y1="-6" x2="7" y2="-6" stroke="#fff" stroke-width="1.5" />
  </g>
</svg>
