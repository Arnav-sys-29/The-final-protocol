<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="damagedCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="45%" stop-color="#b91c1c" />
      <stop offset="85%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="damagedEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
    <filter id="damagedGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Damaged Red Energy Flare -->
  <circle cx="100" cy="95" r="82" fill="url(#damagedCore)" filter="url(#damagedGlow)" opacity="0.95" />

  <!-- Recoiling Tentacles in Pain -->
  <g stroke="#ef4444" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M45,115 Q15,120 20,150 Q25,170 15,185" />
    <path d="M70,130 Q45,145 55,175 Q60,185 50,195" />
    <path d="M130,130 Q155,145 145,175 Q140,185 150,195" />
    <path d="M155,115 Q185,120 180,150 Q175,170 185,185" />
  </g>

  <!-- Monster Head With Fractures -->
  <path d="M100,32 C50,32 35,72 40,107 C45,137 75,147 100,147 C125,147 155,137 160,107 C165,72 150,32 100,32 Z" fill="#450a0a" stroke="#ef4444" stroke-width="5" />

  <!-- Fractured Cracked Horns -->
  <path d="M70,40 L50,22 L75,34 Z" fill="#7f1d1d" stroke="#fca5a5" stroke-width="2" />
  <path d="M130,40 L146,26 L122,34 Z" fill="#7f1d1d" stroke="#fca5a5" stroke-width="2" />
  <path d="M100,32 L98,18 L108,30 Z" fill="#991b1b" stroke="#fecaca" stroke-width="2" />

  <!-- Painful Pierced Eyes -->
  <ellipse cx="100" cy="80" rx="20" ry="26" fill="#000" stroke="#fca5a5" stroke-width="3" />
  <ellipse cx="100" cy="80" rx="16" ry="20" fill="url(#damagedEye)" />
  <ellipse cx="100" cy="80" rx="6" ry="18" fill="#450a0a" />
  <!-- Small contracted pupil -->
  <circle cx="100" cy="80" r="3" fill="#fff" />

  <!-- Painful Secondary Eyes -->
  <ellipse cx="65" cy="88" rx="9" ry="12" fill="url(#damagedEye)" />
  <circle cx="65" cy="88" r="4" fill="#000" />

  <ellipse cx="135" cy="88" rx="9" ry="12" fill="url(#damagedEye)" />
  <circle cx="135" cy="88" r="4" fill="#000" />

  <!-- Roaring Agonized Maw -->
  <ellipse cx="100" cy="124" rx="26" ry="14" fill="#180404" stroke="#f87171" stroke-width="3" />
  <polygon points="84,115 88,122 92,116" fill="#fecaca" />
  <polygon points="96,114 100,123 104,114" fill="#fecaca" />
  <polygon points="108,115 112,122 116,115" fill="#fecaca" />

  <!-- Violent Critical Hit Slash / Spark Marks -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="30" y1="40" x2="80" y2="100" stroke="#fef08a" stroke-width="5" />
    <line x1="75" y1="45" x2="140" y2="115" stroke="#ffffff" stroke-width="4" />
    <line x1="120" y1="65" x2="170" y2="120" stroke="#fef08a" stroke-width="5" />
  </g>

  <!-- Impact Sparks (Pokemon Super-Effective Impact) -->
  <polygon points="100,50 105,65 120,68 108,78 112,94 98,84 85,92 90,77 78,66 94,64" fill="#fef08a" stroke="#f59e0b" stroke-width="2" />
  <polygon points="55,100 60,110 72,112 62,119 65,130 54,124 43,129 47,118 38,110 50,109" fill="#ffffff" stroke="#ef4444" stroke-width="2" />
  <polygon points="145,95 150,105 162,107 152,114 155,125 144,119 133,124 137,113 128,105 140,104" fill="#fef08a" stroke="#dc2626" stroke-width="2" />
</svg>
